name: "Policy Build"
description: "Build policy"
author: "gert@d5s.io"
branding:
  icon: zap
  color: blue
inputs:
  src:
    description: "directory path to build input source"
    required: true
    default: src
  tag:
    description: "build tag"
    required: true
  revision:
    description: "policy bundle revision"
    required: true
    default: "${GITHUB_SHA}"
  verbosity:
    description: "verbosity level [info|error|debug|trace]"
    required: true
    default: error
  source_url:
    description: "source git url of the policy"
    required: true
    default: "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}"
  rego_version:
    description: "rego version used to build (rego.v0 | rego.v1)"
    required: false
    default: rego.v1
  optimize:
    description: "bundle build optimization level [disabled|recommended|aggressive]"
    required: true
    default: disabled
runs:
  using: docker
  image: 'docker://ghcr.io/opcr-io/policy:0.4'
  entrypoint: /app/build.sh
